services:
  catalyst_app_db:
    image: postgres
    volumes:
        - "./pgdata:/var/lib/postgresql/data"
    restart: always
    environment:
        POSTGRES_PASSWORD: a_secure_passvvord
    networks:
        - catalyst_app_network

  catalyst_app_server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
        - "./src:/opt/app"
    # When you have created the app, use something like:  
    # command: "./MyApp/script/myapp_server.pl --restart"
    command: "./dummy.pl" 
    ports:
        - "3000:3000"
    restart: always
    links:
        - "catalyst_app_db"
    networks:
        - catalyst_app_network

networks:
  catalyst_app_network:
    driver: bridge
